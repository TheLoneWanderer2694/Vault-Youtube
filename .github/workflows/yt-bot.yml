name: 24-7 YouTube Webhook Bot

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  check-youtube:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip3 install requests feedparser

      - name: Run YouTube Bot Script
        env:
          WEBHOOK_URL: "${{ secrets.WEBHOOK_URL }}"
          FAVORITE_CHANNELS: "${{ secrets.FAVORITE_CHANNELS }}"
        run: python3 yt_notifier.py
