name: 24-7 YouTube Webhook Bot

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-youtube:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests feedparser

      - name: Run YouTube Bot Script
        env:
          WEBHOOK_URL: "${{ secrets.WEBHOOK_URL }}"
          FAVORITE_CHANNELS: "${{ secrets.FAVORITE_CHANNELS }}"
        run: python yt_notifier.py

      - name: Commit Updated Baseline State
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          touch last_seen_videos.json
          git add last_seen_videos.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "update video baseline cache [skip ci]" && git push)
