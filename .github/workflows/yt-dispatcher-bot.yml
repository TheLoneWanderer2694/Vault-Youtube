  - name: Set up Python Engine
    uses: actions/setup-python@v5
    with:
      python-version: '3.x'

  - name: Install Python Dependencies
    run: |
      python -m pip install --upgrade pip
      pip install requests feedparser

  - name: Run Webhook Dispatcher
    env:
      WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
      FAVORITE_CHANNELS: ${{ secrets.FAVORITE_CHANNELS }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      KEYWORD_FILTER: ${{ secrets.KEYWORD_FILTER }}
      PING_OPTION: ${{ secrets.PING_OPTION }}
      BOT_NAME: ${{ secrets.BOT_NAME }}
      BOT_AVATAR: ${{ secrets.BOT_AVATAR }}
      EMBED_COLOR: ${{ secrets.EMBED_COLOR }}
      TITLE_CASE: ${{ secrets.TITLE_CASE }}
    run: python yt_dispatcher.py

  - name: Commit and Push Updated Cache
    run: |
      git config --global user.name "github-actions[bot]"
      git config --global user.email "github-actions[bot]@users.noreply.github.com"
      git add last_seen_videos.json || true
      git diff --staged --quiet || (git commit -m "chore: update video cache [skip ci]" && git push)
